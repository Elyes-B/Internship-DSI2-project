<!-- METRIC COUNTER CARDS -->
  <div class="row g-3 mb-4">
    <!-- Total Users -->
    <div class="col-12 col-md-4">
      <div class="app-card p-4 d-flex align-items-center justify-content-between">
        <div>
          <span class="text-uppercase fw-semibold small">Total Users</span>
          <h2 class="display-6 fw-bold  mb-0 mt-1">
            @if (allUsersCounter== null) {
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            } @else {
              {{ allUsersCounter }}
            }
          </h2>
        </div>
        <div class="p-3 rounded">
          <i class="bi bi-people fs-4"></i>
        </div>
      </div>
    </div>

    <!-- Admins -->
    <div class="col-12 col-md-4">
      <div class="app-card p-4 d-flex align-items-center justify-content-between">
        <div>
          <span class="text-uppercase fw-semibold small">Admins</span>
          <h2 class="display-6 fw-bold mb-0 mt-1">
            @if (allAdminsCounter== null) {
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            } @else {
              {{ allAdminsCounter }}
            }
          </h2>
        </div>
        <div class="p-3 rounded">
          <i class="bi bi-shield-check fs-4"></i>
        </div>
      </div>
    </div>

    <!-- Superadmins -->
    <div class="col-12 col-md-4">
      <div class="app-card p-4 d-flex align-items-center justify-content-between">
        <div>
          <span class="text-uppercase  fw-semibold small">Superadmins</span>
          <h2 class="display-6 fw-bold mb-0 mt-1">
            @if (allSuperAdminsCounter== null) {
              <span class="spinner-border spinner-border-sm text-info" role="status" aria-hidden="true"></span>
            } @else {
              {{ allSuperAdminsCounter }}
            }
          </h2>
        </div>
        <div class="p-3 rounded">
          <i class="bi bi-star fs-4"></i>
        </div>
      </div>
    </div>
  </div>
