<div class="app-card p-4 mb-4">
  <div class="row g-2 align-items-end">

    <!-- 1. Session ID (Width: 2/12) -->
    <div class="col-12 col-sm-6 col-md-2">
      <label class="form-label fw-semibold app-text-main small">Session ID</label>
      <div class="input-group">
        <span class="input-group-text bg-transparent text-muted px-2">
          <i class="bi bi-hash"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="Session ID..."
          [(ngModel)]="searchSessionId"
          (keyup.enter)="applyFilters()"
        />
      </div>
    </div>

    <!-- 2. Keycloak ID (Width: 2/12) -->
    <div class="col-12 col-sm-6 col-md-2">
      <label class="form-label fw-semibold app-text-main small">Keycloak ID</label>
      <div class="input-group">
        <span class="input-group-text bg-transparent text-muted px-2">
          <i class="bi bi-key"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="UUID..."
          [(ngModel)]="searchKeycloakId"
          (keyup.enter)="applyFilters()"
        />
      </div>
    </div>

    <!-- 3. Username (Width: 2/12) -->
    <div class="col-12 col-sm-6 col-md-2">
      <label class="form-label fw-semibold app-text-main small">Username</label>
      <div class="input-group">
        <span class="input-group-text bg-transparent text-muted px-2">
          <i class="bi bi-person"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="Username..."
          [(ngModel)]="searchUsername"
          (keyup.enter)="applyFilters()"
        />
      </div>
    </div>

    <!-- 4. IP Address (Width: 2/12) -->
    <div class="col-12 col-sm-6 col-md-2">
      <label class="form-label fw-semibold app-text-main small">IP Address</label>
      <div class="input-group">
        <span class="input-group-text bg-transparent text-muted px-2">
          <i class="bi bi-hdd-network"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="IP Address..."
          [(ngModel)]="searchIpAddress"
          (keyup.enter)="applyFilters()"
        />
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-2">
      <div class="form-check mb-2">
        <input
          class="form-check-input"
          type="checkbox"
          id="activeSessionsCheck"
          [(ngModel)]="onlyActiveSessions"
          (change)="applyFilters()"
        />
        <label class="form-check-label fw-semibold app-text-main small" for="activeSessionsCheck">
          Active Only
        </label>
      </div>
    </div>

    <!-- 6. Action Buttons (Width: 2/12) -->
    <div class="col-12 col-md-2 d-flex gap-2">
      <button
        type="button"
        class="btn btn-accent w-100 text-nowrap"
        (click)="applyFilters()">
        <i class="bi bi-funnel-fill me-1"></i> Apply
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary w-100 text-nowrap"
        (click)="resetFilters()">
        <i class="bi bi-x-circle me-1"></i> Reset
      </button>
    </div>

  </div>
</div>
